group = "com.ak.sunmi_device_info_plugin"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.ak.sunmi_device_info_plugin"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
      //  compileOnly(files("libs/SUNMI_CUSTOMER_API_v1.0.46_release.aar"))
        // Add this if not already present
        //implementation(files("libs/SUNMI_CUSTOMER_API_v1.0.46_release.aar"))
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
            aidl.srcDirs += 'src/main/aidl'
        }
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/classes.jar') 
}
